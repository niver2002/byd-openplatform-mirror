name: diag

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS
        run: |
          getent hosts openplatform.byd.com || echo "DNS FAIL openplatform"
          getent hosts openplatform-cdn.byd.com || echo "DNS FAIL cdn"
      - name: curl home
        run: |
          curl -sS -o /dev/null -w "home: %{http_code} dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" \
            --max-time 90 https://openplatform.byd.com/ || echo "home: FAILED $?"
      - name: curl api
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' -d '{"documentType":3}' \
            --max-time 90 -w "\napi: %{http_code} total=%{time_total}\n" \
            https://openplatform.byd.com/api/document-portal/document/portal/getUpDocument | head -c 300 || echo "api: FAILED $?"
      - name: curl cdn
        run: |
          curl -sS -o /dev/null -w "cdn: %{http_code} total=%{time_total} size=%{size_download}\n" \
            --max-time 90 https://openplatform-cdn.byd.com/dop/static/ecoapp/bydauto-openapi.jar || echo "cdn: FAILED $?"
      - name: python urllib
        run: |
          python - <<'PY'
          import time, urllib.request, socket
          socket.setdefaulttimeout(90)
          t=time.time()
          try:
              r=urllib.request.urlopen("https://openplatform.byd.com/")
              print("py home", r.status, round(time.time()-t,2))
          except Exception as e:
              print("py home FAILED", repr(e), round(time.time()-t,2))
          PY
